# =============================================================================
# Casino Platform — nginx (production)
#
#   rb1920.com        → the player app     (/usr/share/nginx/html/web)
#   admin.rb1920.com  → the operator panel (/usr/share/nginx/html/admin)
#   /api/…             → the Node API       (backend:3000, same origin → no CORS)
#
# Both apps are baked into this image by nginx/Dockerfile (see docker-compose.prod.yml).
#
# BEFORE DEPLOYING, replace these two names everywhere in this file:
#     rb1920.com         your domain
#     admin.rb1920.com   your admin domain (or drop that server block)
# =============================================================================

# Do not advertise the nginx version.
server_tokens off;

# Keep a small pool of connections to the API instead of one per request.
upstream casino_api {
    server backend:3000;
    keepalive 32;
}

# Shared proxy settings, so the player and admin blocks cannot drift apart.
# (Defined per-server below; nginx has no macro mechanism, and `include` of a
# snippet would need another mounted file.)

# ---------------------------------------------------------------------------
# Player web app
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name rb1920.com www.rb1920.com;

    root /usr/share/nginx/html/web;
    index index.html;

    client_max_body_size 2m;

    # Baseline hardening. These are set here so every location inherits them;
    # locations below only use `expires`, which does not reset them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Certbot's HTTP-01 challenge, served straight from the mounted webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The API. `proxy_pass` without a URI keeps the original path (/api/...).
    location /api/ {
        proxy_pass http://casino_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A settlement never takes this long; this only stops a stuck request
        # from holding a worker forever.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Never cache money.
        proxy_buffering off;
    }

    # liveness probe used by the compose healthcheck / uptime monitors
    location = /health {
        proxy_pass http://casino_api;
        access_log off;
    }

    # Vite emits content-hashed filenames, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # The SPA shell must never be cached, or a deploy would keep serving the old
    # bundle. `expires -1` sends Cache-Control: no-cache without dropping the
    # security headers above.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# Admin panel
#
# Its router has no basename, so it needs its own hostname rather than a
# /admin sub-path. Point admin.rb1920.com at this server (DNS + certificate).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.rb1920.com;

    root /usr/share/nginx/html/admin;
    index index.html;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://casino_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://casino_api;
        access_log off;
    }

    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

